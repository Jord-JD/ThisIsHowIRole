name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '5.5'
            illuminate: '^5.1'
            composer: 'v2.2'
          - php: '8.5'
            illuminate: '^13.0'
            composer: 'latest'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          tools: composer:${{ matrix.composer }}
          coverage: none
      - run: composer require illuminate/database:${{ matrix.illuminate }} illuminate/support:${{ matrix.illuminate }} --dev --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpunit
